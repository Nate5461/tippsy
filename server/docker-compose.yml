services:
  postgres:
    image: postgres:16-alpine
    container_name: tippsy-postgres
    environment:
      POSTGRES_USER: tippsy
      POSTGRES_PASSWORD: tippsy
      POSTGRES_DB: tippsy
    ports:
      - "5432:5432"
    volumes:
      - tippsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tippsy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tippsy_pgdata:
