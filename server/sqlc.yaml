version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    # Database-backed analysis: search queries use the pg_trgm extension
    # (similarity(), the % operator) which sqlc's built-in catalog doesn't know,
    # so generation requires a reachable Postgres (the same one `make db-up` starts).
    database:
      uri: "postgres://tippsy:tippsy@localhost:5432/tippsy?sslmode=disable"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
